plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.chehartemple.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.chehartemple.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // API URL - overridden per build type
        buildConfigField "String", "API_BASE_URL", '"https://backend-api-4802.onrender.com/api/"'
        buildConfigField "boolean", "ENABLE_LOGGING", "true"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "String", "API_BASE_URL", '"https://backend-api-4802.onrender.com/api/"'
            buildConfigField "boolean", "ENABLE_LOGGING", "false"
        }
        debug {
            buildConfigField "String", "API_BASE_URL", '"https://backend-api-4802.onrender.com/api/"'
            buildConfigField "boolean", "ENABLE_LOGGING", "true"
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.8'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // Compose
    implementation platform('androidx.compose:compose-bom:2023.10.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.activity:activity-compose:1.8.1'
    implementation 'androidx.navigation:navigation-compose:2.7.5'

    // Networking
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // Lifecycle
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.6.2'

    // DataStore for token storage
    implementation 'androidx.datastore:datastore-preferences:1.0.0'

    // Splash Screen API (required for Android 12+)
    implementation 'androidx.core:core-splashscreen:1.0.1'

    // WebView for images
    implementation 'androidx.webkit:webkit:1.8.0'

    // Location
    implementation 'com.google.android.gms:play-services-location:21.0.1'

    // Google Sign-In (Legacy - more reliable on emulators)
    implementation 'com.google.android.gms:play-services-auth:20.7.0'

    // WorkManager for scheduled notifications
    implementation 'androidx.work:work-runtime-ktx:2.9.0'

    // Coil for image loading
    implementation 'io.coil-kt:coil-compose:2.5.0'

    debugImplementation 'androidx.compose.ui:ui-tooling'
}
